<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Written by the Tusche Bar's pixel style. Text in Tiny5 (only the shell in
     the pixel style asks for it) finds its symbols in Tusche Pixel Symbols
     before any Nerd Font. Other families are not affected. -->
<fontconfig>
  <alias binding="strong">
    <family>Tiny5</family>
    <accept><family>Tusche Pixel Symbols</family></accept>
  </alias>
</fontconfig>
