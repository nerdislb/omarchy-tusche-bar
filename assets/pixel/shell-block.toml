# >>> tusche pixel style (written by the Tusche Bar; switch back in its Control Center) >>>
# Tusche Pixel (Tiny5 letters + the pixel symbols) for the shell alone; pixel
# faces want whole multiples of their grid.
[font]
family = "Tusche Pixel"
caption = 16
body-small = 16
body = 16
subtitle = 16
title = 16
heading = 16
display = 32
display-large = 48
icon-large = 24
# The Tusche Bar and Island draw their pixel faces while this says so.
[tusche]
style = "pixel"
# Sliders as whole-pixel segments.
[controls]
slider = "segments"
# Flat, opaque plates: nothing to blur behind them.
[bar]
background-alpha = 1.0
# Bar icons at 16 px: the shell scales this token by base-size / 12, so the
# switch writes the value that lands on 16 for the base size in use.
icon-font = @ICON_FONT@
[popups]
background-alpha = 1.0
[tooltip]
background-alpha = 1.0
[notifications]
background-alpha = 1.0
[menu]
background-alpha = 1.0
[launcher]
background-alpha = 1.0
# <<< tusche pixel style <<<
